<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Table Soccer</title>
<link rel="stylesheet" href="https://usions.com/usion-design-system.css">
<link rel="stylesheet" href="style.css?v=6">
</head>

<body>

<div class="game-container">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="player-info left" id="player1Panel">
      <img id="player1Avatar" alt="">
      <span class="player-name" id="player1Name">Player 1</span>
    </div>
    <div class="score-area">
      <div class="score-line">
        <span class="score" id="score1">0</span>
        <span class="score-dash">:</span>
        <span class="score" id="score2">0</span>
      </div>
      <div class="goals-info" id="goalsInfo">First to 3</div>
    </div>
    <div class="player-info right" id="player2Panel">
      <img id="player2Avatar" alt="">
      <span class="player-name" id="player2Name">Player 2</span>
    </div>
  </div>

  <!-- Turn Indicator -->
  <div class="turn-indicator" id="turnIndicator">Your Turn</div>

  <!-- Field Canvas -->
  <canvas id="field"></canvas>

</div>

<!-- Quick chat -->
<button id="chatToggle" class="chat-toggle" type="button"
  aria-label="Түргэн чат" aria-expanded="false" aria-controls="chatPicker">💬</button>
<div id="chatPicker" class="chat-picker" aria-hidden="true">
  <div class="chat-picker-title">Түргэн чат</div>
  <div class="chat-phrases" id="chatPhrases"></div>
</div>
<div id="reactionLayer" class="reaction-layer" aria-live="polite"></div>

<!-- Waiting Overlay -->
<div id="waitingOverlay" class="overlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <p class="overlay-text" id="waitingText">Waiting for opponent...</p>
    <div class="bot-options">
      <p class="bot-label" id="botLabel">— or play offline —</p>
      <div class="bot-diff" id="botDiff">
        <button class="bot-diff-btn selected" data-diff="easy">Easy</button>
        <button class="bot-diff-btn" data-diff="medium">Medium</button>
        <button class="bot-diff-btn" data-diff="hard">Hard</button>
      </div>
      <button id="playBotBtn" class="btn-confirm">PLAY VS BOT</button>
    </div>
  </div>
</div>

<!-- Tactic Selection Overlay -->
<div id="tacticOverlay" class="overlay">
  <div class="tactic-card">
    <h2 class="tactic-title" id="tacticTitle">SELECT YOUR FORMATION</h2>

    <h3 class="tactic-section" id="atkSection">ATTACKING</h3>
    <div class="tactic-grid" id="attackGrid">
      <div class="tactic-option selected" data-tactic="1-3-2">
        <canvas class="tactic-preview" data-formation="atk-1-3-2"></canvas>
        <span>1-3-2</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-3">
        <canvas class="tactic-preview" data-formation="atk-1-2-3"></canvas>
        <span>1-2-3</span>
      </div>
      <div class="tactic-option" data-tactic="1-4-1">
        <canvas class="tactic-preview" data-formation="atk-1-4-1"></canvas>
        <span>1-4-1</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-1-2">
        <canvas class="tactic-preview" data-formation="atk-1-2-1-2"></canvas>
        <span>1-2-1-2</span>
      </div>
    </div>

    <h3 class="tactic-section" id="defSection">DEFENSIVE</h3>
    <div class="tactic-grid" id="defenseGrid">
      <div class="tactic-option selected" data-tactic="1-3-2">
        <canvas class="tactic-preview" data-formation="def-1-3-2"></canvas>
        <span>1-3-2</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-3">
        <canvas class="tactic-preview" data-formation="def-1-2-3"></canvas>
        <span>1-2-3</span>
      </div>
      <div class="tactic-option" data-tactic="1-4-1">
        <canvas class="tactic-preview" data-formation="def-1-4-1"></canvas>
        <span>1-4-1</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-1-2">
        <canvas class="tactic-preview" data-formation="def-1-2-1-2"></canvas>
        <span>1-2-1-2</span>
      </div>
    </div>

    <div class="tactic-timer"><span id="tacticTimerPre">Starting game in </span><span id="tacticTimer">10</span><span id="tacticTimerPost"></span></div>
    <button class="btn-confirm" id="tacticConfirm">CONFIRM</button>
  </div>
</div>

<!-- Goal Overlay -->
<div id="goalOverlay" class="overlay">
  <div class="goal-card">
    <div class="goal-text" id="goalText">GOAL!</div>
  </div>
</div>

<!-- Foul Overlay -->
<div id="foulOverlay" class="overlay">
  <div class="goal-card">
    <div class="foul-text" id="foulText">FOUL!</div>
    <div class="foul-sub" id="foulSub">First shot goal is not allowed</div>
  </div>
</div>

<!-- Winner Overlay -->
<div id="winnerOverlay" class="overlay">
  <div class="winner-card" id="winnerCard">
    <span class="winner-emoji">⚽</span>
    <div class="winner-label" id="winnerLabel">Winner</div>
    <div class="winner-name" id="winnerName">Player 1</div>
    <div class="winner-score" id="winnerScore">3 - 1</div>
    <div class="winner-actions">
      <button class="btn-primary" id="winnerPlayAgain">Play Again</button>
      <button class="btn-outline" id="winnerShare">Share</button>
    </div>
  </div>
</div>

<!-- The Usion platform injects the SDK for hosted bundles; the explicit tag
     keeps the game working self-hosted / in the devkit too. -->
<script src="https://usions.com/usion-sdk.js"></script>
<script src="script.js?v=26"></script>

</body>
</html>
