<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Table Soccer</title>
<link rel="stylesheet" href="https://usions.com/usion-design-system.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="player-info left" id="player1Panel">
      <img id="player1Avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=red">
      <span class="player-name" id="player1Name">Player 1</span>
    </div>
    <div class="score-area">
      <span class="score" id="score1">0</span>
      <span class="score-dash">-</span>
      <span class="score" id="score2">0</span>
      <div class="goals-info">Goals to win: 3</div>
    </div>
    <div class="player-info right" id="player2Panel">
      <img id="player2Avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=blue">
      <span class="player-name" id="player2Name">Player 2</span>
    </div>
  </div>

  <!-- Turn Indicator -->
  <div class="turn-indicator" id="turnIndicator">Your Turn</div>

  <!-- Field Canvas -->
  <canvas id="field"></canvas>

  <!-- Controls -->
  <div class="controls">
    <button id="resetBtn">Restart</button>
  </div>

</div>

<!-- Waiting Overlay -->
<div id="waitingOverlay" class="overlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <p class="overlay-text">Waiting for opponent...</p>
  </div>
</div>

<!-- Tactic Selection Overlay -->
<div id="tacticOverlay" class="overlay">
  <div class="tactic-card">
    <h2 class="tactic-title">SELECT YOUR FORMATION</h2>

    <h3 class="tactic-section">ATTACKING</h3>
    <div class="tactic-grid" id="attackGrid">
      <div class="tactic-option selected" data-tactic="1-3-2">
        <canvas class="tactic-preview" data-formation="atk-1-3-2"></canvas>
        <span>1-3-2</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-3">
        <canvas class="tactic-preview" data-formation="atk-1-2-3"></canvas>
        <span>1-2-3</span>
      </div>
      <div class="tactic-option" data-tactic="1-4-1">
        <canvas class="tactic-preview" data-formation="atk-1-4-1"></canvas>
        <span>1-4-1</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-1-2">
        <canvas class="tactic-preview" data-formation="atk-1-2-1-2"></canvas>
        <span>1-2-1-2</span>
      </div>
    </div>

    <h3 class="tactic-section">DEFENSIVE</h3>
    <div class="tactic-grid" id="defenseGrid">
      <div class="tactic-option selected" data-tactic="1-3-2">
        <canvas class="tactic-preview" data-formation="def-1-3-2"></canvas>
        <span>1-3-2</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-3">
        <canvas class="tactic-preview" data-formation="def-1-2-3"></canvas>
        <span>1-2-3</span>
      </div>
      <div class="tactic-option" data-tactic="1-4-1">
        <canvas class="tactic-preview" data-formation="def-1-4-1"></canvas>
        <span>1-4-1</span>
      </div>
      <div class="tactic-option" data-tactic="1-2-1-2">
        <canvas class="tactic-preview" data-formation="def-1-2-1-2"></canvas>
        <span>1-2-1-2</span>
      </div>
    </div>

    <div class="tactic-timer">Starting game in <span id="tacticTimer">10</span></div>
    <button class="btn-confirm" id="tacticConfirm">CONFIRM</button>
  </div>
</div>

<!-- Goal Overlay -->
<div id="goalOverlay" class="overlay">
  <div class="goal-card">
    <div class="goal-text">GOAL!</div>
  </div>
</div>

<!-- Winner Overlay -->
<div id="winnerOverlay" class="overlay">
  <div class="winner-card" id="winnerCard">
    <span class="winner-emoji">⚽</span>
    <div class="winner-label">Winner</div>
    <div class="winner-name" id="winnerName">Player 1</div>
    <div class="winner-score" id="winnerScore">3 - 1</div>
    <div class="winner-actions">
      <button class="btn-primary" id="winnerPlayAgain">Play Again</button>
      <button class="btn-outline" id="winnerShare">Share</button>
    </div>
  </div>
</div>

<script src="https://usions.com/usion-sdk.js"></script>
<script src="script.js"></script>

</body>
</html>
